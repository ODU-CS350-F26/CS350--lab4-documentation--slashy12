plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
    }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

// Copy the hand-written web pages (src/main/html) into build/reports
tasks.register('copyHtml', Copy) {
    mustRunAfter 'build'
    from 'src/main/html'
    into layout.buildDirectory.dir('reports')
}

// Copy the generated javadoc (build/docs) into build/reports
tasks.register('copyDocs', Copy) {
    dependsOn 'javadoc'
    mustRunAfter 'build'
    from layout.buildDirectory.dir('docs')
    into layout.buildDirectory.dir('reports')
}

// Build everything and gather all reports into build/reports
tasks.register('reports') {
    dependsOn 'build', 'copyHtml', 'copyDocs'
}

// Publish build/reports to the gh-pages branch
gitPublish {
    repoUri = 'git@github.com:ODU-CS350-F26/CS350--lab4-documentation--slashy12.git'
    branch = 'gh-pages'
    commitMessage = 'Publish reports'
    contents {
        from layout.buildDirectory.dir('reports')
    }
}

// Make sure the reports exist before they are copied for publishing
tasks.named('gitPublishCopy') {
    dependsOn 'reports'
}

// Build the reports and push them to the website
tasks.register('deployReports') {
    dependsOn 'gitPublishPush'
}
